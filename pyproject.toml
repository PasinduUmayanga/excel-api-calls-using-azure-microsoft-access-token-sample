[project]
name = "apirunner"
version = "1.0.0"
description = "Generic API caller: single calls with auto-bound parameters, Excel bulk with validation and retry, AI assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.0",
    "pywebview>=5.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "rapidfuzz>=3.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-cov>=5", "playwright>=1.45"]

[project.scripts]
apirunner = "apirunner.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apirunner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
