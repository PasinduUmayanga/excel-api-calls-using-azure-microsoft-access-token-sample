version: 1.0.{build}
image: Visual Studio 2022

environment:
  PYTHON: "C:\Python312-x64"

install:
  - set PATH=%PYTHON%;%PYTHON%\Scripts;%PATH%
  - python --version
  - python -m pip install --upgrade pip pyinstaller

build_script:
  - python -m py_compile api_client_ui.py
  - pyinstaller --onefile --windowed --name ApiClient api_client_ui.py

test: off

artifacts:
  - path: dist\ApiClient.exe
    name: ApiClient
